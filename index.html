<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>CinéTrack</title>
</head>
<body class="bg-gray-950 text-white min-h-screen">
    <section class="relative min-h-[600px] overflow-hidden">
        <img src="./img/dark image.jpeg" alt="Background image" class="absolute inset-0 h-full w-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-r from-gray-950 via-gray-950/70 to-transparent"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-transparent to-transparent"></div>
        <header class="relative z-10 border-b border-white/10 bg-gradient-to-b from-black/60 to-transparent">
            <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-6 py-3">
                <img src="./img/logo.svg" alt="Logo de CinéTrack" class="h-10 w-auto">
                <div class="flex items-center gap-3">
                    <div class="search relative flex items-center">
                        <input type="text" id="search" placeholder="Search movies or series..." class="bg-gray-950 border border-gray-700 w-full text-sm sm:text-base p-2.5 pr-10 rounded-lg outline-none shadow text-white">
                        <span class="absolute right-3 flex items-center pointer-events-none text-gray-500">
                            <i class="fa fa-search"></i>
                        </span>
                    </div>
                    <button class="favoris bg-gray-950 border border-gray-700 text-sm sm:text-base p-2.5 rounded-lg shadow text-gray-500 hover:text-white">
                        <i class="fa-regular fa-heart"></i>
                    </button>
                </div>
            </div>
        </header>
    </section>
</body>
</html>
