<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>CinéTrack</title>
</head>
<body class="bg-gray-950 text-white min-h-screen font-sans">
    <section class="relative min-h-[520px] overflow-hidden">
        <img src="./img/dark image.jpeg" alt="Background image" class="absolute inset-0 h-full w-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-r from-gray-950 via-gray-950/70 to-transparent"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-transparent to-transparent"></div>
        <header class="relative z-10 border-b border-white/10 bg-gradient-to-b from-black/60 to-transparent">
            <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-6 py-3">
                <img src="./img/logo.svg" alt="Logo de CinéTrack" class="h-10 w-auto">
                <div class="flex items-center gap-3">
                    <div class="search relative flex items-center">
                        <input type="text" id="movies" placeholder="Search movies or series..." class="bg-gray-950 focus:border-4 border-red-600 w-full text-sm sm:text-base p-2.5 pr-10 rounded-lg outline-none shadow text-white transition-all">
                        <span class="absolute right-3 flex items-center pointer-events-none text-gray-500">
                            <i class="fa fa-search"></i>
                        </span>
                    </div>
                </div>
            </div>
        </header>
        <div class="pageIntroduction relative z-10 mx-auto max-w-6xl px-6 pt-24">
            <p class="font-serif font-bold text-2xl text-balance max-w-xl">
                CinéTrack lets you search movies and series, build your watchlist, and rate what you love, all in one place.
            </p>
        </div>
        <div class="relative z-10 mx-auto max-w-6xl px-6 flex justify-end mt-16 pb-8">
            <select name="statut" id="statut" class="bg-gray-900 w-36 text-sm sm:text-base p-2.5 focus:border-4 border-red-600 rounded-lg outline-none shadow transition-all">
                <option value="all">All</option>
                <option value="movies">Movies</option>
                <option value="series">Series</option>
            </select>
        </div>
    </section>
    <section class="relative z-10 bg-gray-950">
        <div id="cards-container" class="mx-auto max-w-6xl px-6 pt-4 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-6"></div>
        <div id="modal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
            <div class="modal-content relative bg-gray-900 rounded-xl p-6 max-w-lg w-full max-h-[90vh] overflow-y-auto">
                <button class="close-btn absolute right-4 top-3 text-2xl text-gray-400 hover:text-white">
                    &times;
                </button>
                <div id="modal-body"></div>
            </div>
        </div>
    </section>
    <script type="module" src="./js/cards.js"></script>
    <script type="module" src="./js/recherche-filtrer.js"></script>
</body>
</html>
